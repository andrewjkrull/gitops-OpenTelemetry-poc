apiVersion: apps/v1
kind: Deployment
metadata:
  name: otel-collector-gateway
  namespace: observability
  labels:
    app: otel-collector-gateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app: otel-collector-gateway
  template:
    metadata:
      labels:
        app: otel-collector-gateway
      annotations:
        # Exclude this pod from fluent-bit log collection. Without this,
        # enabling debug-exporter verbosity: detailed creates a feedback
        # loop — fluent-bit tails gateway stdout, ships records back to
        # the gateway, gateway dumps them again with one more layer of
        # nesting per cycle. The gateway sits upstream of fluent-bit in
        # the data flow; downstream components must never become input
        # sources for upstream ones.
        fluentbit.io/exclude: "true"
    spec:
      serviceAccountName: otel-collector-gateway
      containers:
        - name: otel-collector
          image: otel/opentelemetry-collector-contrib:0.123.0
          imagePullPolicy: IfNotPresent
          args:
            - --config=/conf/config.yaml
          ports:
            - containerPort: 4317
              name: otlp-grpc
              protocol: TCP
            - containerPort: 4318
              name: otlp-http
              protocol: TCP
            - containerPort: 8888
              name: metrics
              protocol: TCP
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 512Mi
          volumeMounts:
            - mountPath: /conf
              name: config
      volumes:
        - name: config
          configMap:
            name: otel-collector-gateway-config

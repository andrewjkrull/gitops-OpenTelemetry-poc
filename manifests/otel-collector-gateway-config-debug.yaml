apiVersion: v1
kind: ConfigMap
metadata:
  name: otel-collector-gateway-config
  namespace: observability
data:
  config.yaml: |
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
          http:
            endpoint: 0.0.0.0:4318

    processors:
      batch:
        timeout: 5s
        send_batch_size: 1024
      memory_limiter:
        check_interval: 5s
        limit_mib: 200
        spike_limit_mib: 50
      # Rename service.name → service_name so Loki accepts it as a stream label
      # (Loki labels cannot contain dots)
      resource:
        attributes:
          - key: service_name
            from_attribute: service.name
            action: insert

    exporters:
      otlp/tempo:
        endpoint: tempo.observability.svc.cluster.local:4317
        tls:
          insecure: true

      otlphttp/loki:
        endpoint: http://loki.observability.svc.cluster.local:3100/otlp
        tls:
          insecure: true

      prometheusremotewrite:
        endpoint: http://kps-prometheus.observability.svc.cluster.local:9090/api/v1/write
        tls:
          insecure: true
        resource_to_telemetry_conversion:
          enabled: true

      # Detailed verbosity dumps full attribute maps to gateway stdout.
      # Sampled to avoid flooding: first 5 records pass through, then 1-in-1000.
      debug:
        verbosity: detailed
        sampling_initial: 5
        sampling_thereafter: 1000

    service:
      telemetry:
        logs:
          # info needed for the debug exporter's record dumps to surface
          # (warn would suppress them in some collector versions)
          level: info
        metrics:
          level: detailed
          readers:
            - pull:
                exporter:
                  prometheus:
                    host: 0.0.0.0
                    port: 8888
      pipelines:
        traces:
          receivers:  [otlp]
          processors: [memory_limiter, resource, batch]
          exporters:  [otlp/tempo]
        # Logs fan out to both Loki (production path, untouched) and debug
        # (gateway stdout). Debug is sampled and runs in parallel — the Loki
        # path keeps working regardless.
        logs:
          receivers:  [otlp]
          processors: [memory_limiter, resource, batch]
          exporters:  [otlphttp/loki, debug]
        metrics:
          receivers:  [otlp]
          processors: [memory_limiter, resource, batch]
          exporters:  [prometheusremotewrite]
